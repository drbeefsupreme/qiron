<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage · Too Late TV</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/compositor.js"></script>
    <script defer src="/stage.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body data-view="stage">
    <header>
      <div class="network"><i aria-hidden="true">▥</i> TOO LATE <b>TV</b></div>
      <div class="feed"><em></em> <span id="signal">CONNECTING</span></div>
    </header>
    <main>
      <div class="eyebrow">QYRON / STAGE FEED</div>
      <h1><span id="stage-title">Stage display</span><span>.</span></h1>
      <figure class="stage-monitor">
        <canvas id="stage-canvas" width="128" height="96" role="img" aria-label="Stage display" aria-describedby="stage-layers"></canvas>
        <figcaption><span id="stage-layers">Waiting for feed</span><span>128 × 96</span></figcaption>
      </figure>
      <section id="stage-gif" hidden><p id="stage-file" class="stageinfo"></p></section>
      <section id="stage-blood" hidden>
        <div class="stageinfo quote"><div>ORACLE MARK <b id="mark">…</b></div><div>BULLISH <b id="bulls">0</b></div><div>BEARISH <b id="bears">0</b></div></div>
      </section>
      <details id="stage-scrolls" hidden>
        <summary>On-air text</summary>
        <dl></dl>
      </details>
      <p id="error" role="alert"></p>
    </main>
    <footer>TOO LATE SHOW <span>◆</span> CROWNET TERMINAL</footer>
  </body>
</html>
