<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage · Too Late TV</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/stage.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body data-view="stage">
    <header>
      <div class="network"><i aria-hidden="true">▥</i> TOO LATE <b>TV</b></div>
      <div class="feed"><em></em> <span id="signal">CONNECTING</span></div>
    </header>
    <main>
      <div class="eyebrow">QYRON / STAGE FEED</div>
      <h1><span id="stage-title">Stage display</span><span>.</span></h1>
      <section id="stage-gif" hidden>
      <section class="board">
        <aside id="l4"></aside>
        <div>
          <div id="l2"></div>
          <h2 id="l1">Waiting for feed</h2>
          <div id="l3"></div>
        </div>
        <aside id="l5"></aside>
      </section>
      <p class="stageinfo" id="stage-file"></p>
      </section>
      <section id="stage-blood" hidden>
        <div class="stageinfo quote"><div>ORACLE MARK <b id="mark">…</b></div><div>BULLISH <b id="bulls">0</b></div><div>BEARISH <b id="bears">0</b></div></div>
        <figure class="chart"><canvas id="candles" width="288" height="108" role="img" aria-label="Price candlesticks"></canvas><figcaption>10-SECOND CANDLES <span>OPEN / HIGH / LOW / CLOSE</span></figcaption></figure>
      </section>
      <section id="stage-intro" hidden>
        <img id="intro-screen" width="128" height="96" alt="Christmas telethon loop: CAW-IN hotline, PISS COIN mint, Santa tracker and Crow data feed">
      </section>
      <p id="error" role="alert"></p>
    </main>
    <footer>TOO LATE SHOW <span>◆</span> CROWNET TERMINAL</footer>
  </body>
</html>
